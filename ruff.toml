# Maximum allowed line length
line-length = 79

# Target Python version
target-version = "py312"

[lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
]

exclude = [
    ".git",
    ".github",
    "__pycache__",
    "venv",
]

[lint.isort]
split-on-trailing-comma = false

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true
