name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Ruff (lint)
        working-directory: .
        run: ruff check .

      - name: Run Ruff (format check)
        working-directory: .
        run: ruff format --check .

      - name: Run mypy
        working-directory: .
        run: mypy .

      - name: Run tests
        working-directory: .
        run: pytest
